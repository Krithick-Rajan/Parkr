<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Parkr</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/logo/parkr-logo-orange.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/auth.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <script src="assets/js/utils.js" defer></script>
  <script src="assets/js/models.js" defer></script>
  <script src="assets/js/store.js" defer></script>
  <script type="module" src="assets/js/firebase-backend.js"></script>
  <script src="assets/js/app.js" defer></script>
  <script src="assets/js/auth.js" defer></script>
</head>
<body class="auth-page" data-auth-page="login">
  <main class="auth-shell">
    <section class="auth-panel" aria-label="Parkr parking preview">
      <div class="auth-panel-content">
        <span class="eyebrow">Welcome back</span>
        <h1>Reserve, manage, and verify parking from one place.</h1>
        <p>Choose your registered role to open the matching workspace.</p>
      </div>
    </section>

    <section class="auth-card" aria-labelledby="login-title">
      <a class="auth-brand" href="index.html">
        <span class="brand-logo"><img src="assets/images/logo/parkr-logo.png" alt="Parkr logo"></span>
        <span class="brand-title"><strong>Parkr</strong><span>Find. Park. Go.</span></span>
      </a>
      <h2 id="login-title">Login</h2>
      <p>Use the email, password, and role you selected during registration.</p>

      <form class="auth-form" id="loginForm">
        <div class="field">
          <label for="loginEmail">Email address</label>
          <input id="loginEmail" name="email" type="email" autocomplete="email" required placeholder="name@example.com">
        </div>
        <div class="field">
          <label for="loginPassword">Password</label>
          <input id="loginPassword" name="password" type="password" autocomplete="current-password" required placeholder="Enter password">
        </div>
        <fieldset class="field">
          <legend class="form-label">Login as</legend>
          <div class="role-grid">
            <label class="role-option"><input type="radio" name="role" value="driver" checked><span>Driver</span></label>
            <label class="role-option"><input type="radio" name="role" value="owner"><span>Owner</span></label>
            <label class="role-option"><input type="radio" name="role" value="admin"><span>Admin</span></label>
          </div>
        </fieldset>
        <button class="btn btn-primary btn-block" type="submit">Login</button>
        <p class="sr-status muted" data-auth-message aria-live="polite"></p>
      </form>

      <div class="auth-links">
        <a href="index.html">Back home</a>
        <span>New here? <a href="register.html">Create account</a></span>
      </div>
    </section>
  </main>
</body>
</html>
